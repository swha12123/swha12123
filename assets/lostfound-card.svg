<svg
  width="400"
  height="150"
  viewBox="0 0 400 150"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">lostfound</title>
  <desc id="descId">캠퍼스 분실물 통합 게시판 (Spring Boot 기반)</desc>
  <style>
    /* 보는 사람의 테마에 맞춰 색이 바뀌도록 기본은 라이트, 어두운 테마일 때만 덮어쓴다.
       (한쪽 테마 색을 고정으로 박아두면 반대 테마에서 카드만 검은 상자처럼 튄다.) */
    .bg     { fill: #ffffff; }
    .border { stroke: #d0d7de; }
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #1f2328; }
    .description { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #59636e; }
    .gray   { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #59636e; }
    .icon   { fill: #59636e; }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #151515; }
      .border { stroke: #30363d; }
      .header { fill: #ffffff; }
      .description { fill: #9f9f9f; }
      .gray   { fill: #9f9f9f; }
      .icon   { fill: #8b949e; }
    }
  </style>

  <rect class="bg border" x="0.5" y="0.5" rx="4.5" height="99%" width="399" />

  <g transform="translate(25, 35)">
    <g transform="translate(0, 0)">
      <svg class="icon" x="0" y="-13" viewBox="0 0 16 16" width="16" height="16">
        <path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"/>
      </svg>
    </g>
    <g transform="translate(25, 0)">
      <text x="0" y="0" class="header">lostfound</text>
    </g>
  </g>

  <g transform="translate(0, 55)">
    <text class="description" x="25" y="-5">
      <tspan dy="1.2em" x="25">캠퍼스 분실물 통합 게시판</tspan>
      <tspan dy="1.2em" x="25">(Spring Boot 기반)</tspan>
    </text>

    <g transform="translate(30, 50)">
      <g transform="translate(0, 0)">
        <circle cx="0" cy="-5" r="6" fill="#b07219" />
        <text class="gray" x="15">Java</text>
      </g>
    </g>
  </g>
</svg>
